<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1ec"><meta name="description" content="နေ့ရက် — NayYet. A bilingual Myanmar calendar for everyday dates."><title>နေ့ရက် — NayYet</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head>
<body><a href="#calendar" class="skip" id="skip">ပြက္ခဒိန်သို့</a><div class="app"><header><a href="./" class="brand"><span class="brand-orbit">◒</span><span>နေ့ရက် <small>NayYet</small></span></a><div class="header-actions"><button id="today" class="quiet"></button><button id="language" aria-label="Switch language">English</button></div></header>
<main><section class="season-banner" id="season-banner"><p id="season-kicker"></p><h2 id="season-title"></h2></section><form id="date-search" class="search-bar"><label for="search-input" id="search-label"></label><input id="search-input" type="text" inputmode="numeric" placeholder="YYYY-MM-DD / DD/MM/YYYY" required><button type="submit" id="search-button"></button><button type="button" id="day-back">←</button><button type="button" id="day-forward">→</button></form><section id="quote-panel" class="quote-panel"><p id="quote-caption"></p><blockquote id="daily-quote"></blockquote><div class="quote-actions"><label><span id="theme-label"></span> <select id="quote-theme"><option value="monthly">Monthly theme</option><option value="universe">Universe</option><option value="skyline">Skyline</option></select></label><button id="save-quote"></button><button id="share-quote"></button></div><p id="export-status" role="status"></p></section><div class="intro"><div><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1></div><label class="date-picker"><span id="jump-label"></span><input id="jump" type="date" min="1900-01-01" max="2100-12-31" required></label></div><div id="error" role="alert" hidden></div><div class="layout"><section id="calendar" class="calendar" aria-labelledby="month-title"><div class="month-nav"><div><h2 id="month-title"></h2><p id="lunar-range"></p></div><div class="arrows"><button id="prev" aria-label="Previous month">←</button><button id="next" aria-label="Next month">→</button></div></div><div class="weekdays" id="weekdays"></div><div class="days" id="days"></div><div class="legend"><span><i class="dot"></i><span id="sabbath-legend"></span></span><span id="range-legend"></span></div></section><aside id="details" aria-live="polite"></aside></div><section class="upcoming"><div class="section-title"><h2 id="upcoming-title"></h2><span id="upcoming-subtitle"></span></div><div id="upcoming-list"></div></section><details class="about"><summary id="about-title"></summary><p id="about-copy"></p></details></main><footer><span>နေ့ရက် — NayYet</span><span>© 2026 <a href="https://minsithu.org/" rel="noopener">Min SiThu (itsmeminsithu)</a><a href="https://minsithu.org/contact/" rel="noopener" id="contact"></a></span></footer></div></body></html>
