name: Build Android debug APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 prepare_android.py
        working-directory: android_flutter
      - run: flutter test
        working-directory: android_flutter
      - run: flutter build apk --debug
        working-directory: android_flutter
      - uses: actions/upload-artifact@v4
        with:
          name: nayyet-android-debug
          path: android_flutter/build/app/outputs/flutter-apk/app-debug.apk
